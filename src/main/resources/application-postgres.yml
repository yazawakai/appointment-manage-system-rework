# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Requires the PostgreSQL driver dependency:
#   <dependency>
#     <groupId>org.postgresql</groupId>
#     <artifactId>postgresql</artifactId>
#     <scope>runtime</scope>
#   </dependency>
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/appointment
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
