spring:
  application:
    name: appointment-manage-system

  datasource:
    # SQLite file database with WAL journal mode and a busy timeout so that concurrent
    # writers wait instead of failing immediately with SQLITE_BUSY.
    url: jdbc:sqlite:appointment.db?journal_mode=WAL&busy_timeout=10000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
